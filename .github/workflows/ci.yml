name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, host tests, simulator tests, API check
        run: ./gradlew :widgetbridge:build :widgetbridge:testAndroidHostTest :widgetbridge:iosSimulatorArm64Test :widgetbridge:apiCheck --no-daemon
      - name: Swift package tests
        run: swift test
      - name: Sample Android
        run: ./gradlew :sample:androidApp:assembleDebug --no-daemon
